# /etc/nginx/sites-available/carlite
# Domaine principal : carlite.fr — www.carlite.fr redirige vers carlite.fr.
# Certbot ajoute ensuite le HTTPS automatiquement (sudo certbot --nginx -d carlite.fr -d www.carlite.fr).

limit_req_zone $binary_remote_addr zone=carlite_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.carlite.fr;
    return 301 https://carlite.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name carlite.fr;

    client_max_body_size 20m;   # photos envoyées depuis l'admin (15 Mo max côté application)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Photos uploadées depuis l'admin (stockage local, dossier persistant hors des versions)
    location /media/ {
        alias /var/www/carlite-data/media/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Fichiers statiques Next.js : cache long (noms versionnés)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Photos du catalogue livrées avec le code
    location ~ ^/(uploads|images)/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        limit_req zone=carlite_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/carlite-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/carlite-proxy.conf;
    }
}
